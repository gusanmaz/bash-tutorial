<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgFL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="untrackedBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2020"/>
      <stop offset="100%" stop-color="#264653"/>
    </linearGradient>
    <marker id="arrY" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e9c46a"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2a9d8f"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e76f51"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00b4d8"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="920" height="620" fill="url(#bgFL)" rx="12"/>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" fill="#e0e0e0" font-size="18" font-weight="bold">Git Dosya Yaşam Döngüsü</text>
  <text x="460" y="52" text-anchor="middle" fill="#909090" font-size="11">Kalın oklar = ileri | Kesik mavi oklar = geri al / iptal</text>

  <!-- ===== ZONE 1: Working Directory ===== -->
  <rect x="40" y="68" width="840" height="148" rx="12" fill="#0d1b2a" stroke="#e76f51" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="68" y="92" fill="#e76f51" font-size="13" font-weight="bold">📂 Working Directory (Çalışma Dizini)</text>

  <!-- ===== UNTRACKED — özel vurgu ===== -->
  <g filter="url(#shadow)">
    <!-- dış çerçeve — dikkat çekici -->
    <rect x="58" y="104" width="248" height="100" rx="14" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="8,4" opacity="0.9"/>
    <rect x="68" y="114" width="228" height="80" rx="12" fill="url(#untrackedBg)" stroke="#ff6b6b" stroke-width="3"/>
    <!-- YENİ badge -->
    <rect x="78" y="104" width="52" height="18" rx="4" fill="#ff6b6b"/>
    <text x="104" y="117" text-anchor="middle" fill="#1a1a2e" font-size="9" font-weight="bold">YENİ</text>
    <text x="182" y="138" text-anchor="middle" fill="#ff6b6b" font-size="14" font-weight="bold">Untracked</text>
    <text x="182" y="156" text-anchor="middle" fill="#ffb4b4" font-size="10">Git bu dosyayı henüz tanımıyor</text>
    <text x="182" y="172" text-anchor="middle" fill="#a0a0a0" font-size="9">örn. not.txt, resim.png — yeni oluşturuldu</text>
    <text x="182" y="186" text-anchor="middle" fill="#707070" font-size="9">git status'ta kırmızı / ?? görünür</text>
  </g>

  <!-- Untracked callout -->
  <rect x="68" y="198" width="228" height="14" rx="3" fill="#3d2020" stroke="#ff6b6b" stroke-width="1"/>
  <text x="182" y="208" text-anchor="middle" fill="#ff9999" font-size="8">⚠️ Sadece ilk kez eklenen dosyalar buradan başlar</text>

  <!-- Modified node -->
  <g filter="url(#shadow)">
    <rect x="580" y="124" width="220" height="72" rx="12" fill="#264653" stroke="#e76f51" stroke-width="2.5"/>
    <text x="690" y="150" text-anchor="middle" fill="#e76f51" font-size="14" font-weight="bold">Modified</text>
    <text x="690" y="168" text-anchor="middle" fill="#a0a0a0" font-size="10">Daha önce commit edilmiş dosyayı değiştirdiniz</text>
    <text x="690" y="184" text-anchor="middle" fill="#707070" font-size="9">git status'ta modified görünür</text>
  </g>

  <!-- ===== ZONE 2: Staging ===== -->
  <rect x="40" y="232" width="840" height="96" rx="12" fill="#0d1b2a" stroke="#e9c46a" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="68" y="256" fill="#e9c46a" font-size="13" font-weight="bold">📋 Staging Area (Sepet / Hazırlık)</text>

  <g filter="url(#shadow)">
    <rect x="360" y="248" width="200" height="64" rx="12" fill="#264653" stroke="#e9c46a" stroke-width="2.5"/>
    <text x="460" y="274" text-anchor="middle" fill="#e9c46a" font-size="14" font-weight="bold">Staged</text>
    <text x="460" y="294" text-anchor="middle" fill="#a0a0a0" font-size="10">Commit'e girmeye aday — git add yapıldı</text>
  </g>

  <!-- ===== ZONE 3: Repository ===== -->
  <rect x="40" y="346" width="840" height="96" rx="12" fill="#0d1b2a" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="68" y="370" fill="#2a9d8f" font-size="13" font-weight="bold">🗄️ Repository (.git — arşiv)</text>

  <g filter="url(#shadow)">
    <rect x="360" y="362" width="200" height="64" rx="12" fill="#264653" stroke="#2a9d8f" stroke-width="2.5"/>
    <text x="460" y="388" text-anchor="middle" fill="#2a9d8f" font-size="14" font-weight="bold">Committed</text>
    <text x="460" y="408" text-anchor="middle" fill="#a0a0a0" font-size="10">Son commit ile aynı — güvenle kayıtlı</text>
  </g>

  <!-- ===== MAIN FLOW ===== -->
  <path d="M 182,194 Q 182,228 360,262" fill="none" stroke="#e9c46a" stroke-width="2.5" marker-end="url(#arrY)"/>
  <rect x="228" y="208" width="88" height="34" rx="5" fill="#1a1a2e" stroke="#e9c46a" stroke-width="1"/>
  <text x="272" y="222" text-anchor="middle" fill="#e9c46a" font-size="9" font-weight="bold">git add</text>
  <text x="272" y="234" text-anchor="middle" fill="#707070" font-size="8">(ilk kez takibe al)</text>

  <path d="M 690,196 Q 690,228 560,262" fill="none" stroke="#e9c46a" stroke-width="2.5" marker-end="url(#arrY)"/>
  <rect x="628" y="212" width="72" height="22" rx="4" fill="#1a1a2e" stroke="#e9c46a" stroke-width="1"/>
  <text x="664" y="227" text-anchor="middle" fill="#e9c46a" font-size="9" font-weight="bold">git add</text>

  <line x1="460" y1="312" x2="460" y2="356" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#arrG)"/>
  <rect x="472" y="324" width="78" height="22" rx="4" fill="#1a1a2e" stroke="#2a9d8f" stroke-width="1"/>
  <text x="511" y="339" text-anchor="middle" fill="#2a9d8f" font-size="9" font-weight="bold">git commit</text>

  <path d="M 560,394 Q 830,394 830,156 Q 830,124 802,124" fill="none" stroke="#e76f51" stroke-width="2.5" marker-end="url(#arrR)"/>
  <rect x="762" y="262" width="100" height="22" rx="4" fill="#1a1a2e" stroke="#e76f51" stroke-width="1"/>
  <text x="812" y="277" text-anchor="middle" fill="#e76f51" font-size="9" font-weight="bold">dosyayı düzenle</text>

  <!-- ===== UNDO ARROWS (simplified labels on diagram) ===== -->
  <path d="M 578,160 Q 500,160 500,394" fill="none" stroke="#00b4d8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrB)"/>
  <path d="M 538,276 Q 610,276 632,196" fill="none" stroke="#00b4d8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrB)"/>
  <path d="M 362,276 Q 290,276 268,196" fill="none" stroke="#00b4d8" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrB)"/>

  <!-- ===== GERİ ALMA AÇIKLAMA PANELİ ===== -->
  <rect x="40" y="458" width="840" height="148" rx="10" fill="#0d1b2a" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="460" y="482" text-anchor="middle" fill="#00b4d8" font-size="13" font-weight="bold">↩️ Geri alma komutları — ne işe yarar?</text>
  <line x1="460" y1="490" x2="460" y2="594" stroke="#303030" stroke-width="1"/>

  <!-- Sol: git restore -->
  <rect x="55" y="500" width="390" height="58" rx="8" fill="#16213e" stroke="#404040" stroke-width="1"/>
  <text x="68" y="518" fill="#00b4d8" font-size="11" font-weight="bold">git restore dosya</text>
  <text x="68" y="534" fill="#c0c0c0" font-size="10">"Yaptığım düzenlemeyi sil, son kayıtlı hale dön"</text>
  <text x="68" y="550" fill="#909090" font-size="9">Modified → Committed hali (dosya diskte kalır, içerik eski commit'teki gibi olur)</text>

  <!-- Sağ üst: git restore --staged -->
  <rect x="475" y="500" width="390" height="58" rx="8" fill="#16213e" stroke="#404040" stroke-width="1"/>
  <text x="488" y="518" fill="#00b4d8" font-size="11" font-weight="bold">git restore --staged dosya</text>
  <text x="488" y="534" fill="#c0c0c0" font-size="10">"Sepetten çıkar" — git add'i iptal</text>
  <text x="488" y="550" fill="#909090" font-size="9">Eski dosyada: Modified'a döner, Git takip eder. Yeni dosyada: Untracked</text>

  <!-- Sağ alt: git rm --cached -->
  <rect x="475" y="566" width="390" height="32" rx="8" fill="#16213e" stroke="#404040" stroke-width="1"/>
  <text x="488" y="580" fill="#00b4d8" font-size="10" font-weight="bold">git rm --cached dosya</text>
  <text x="488" y="592" fill="#909090" font-size="9">Repodan takibi kalıcı bırak (commit gerekir) — .env gibi dosyalar için</text>

  <!-- Sol alt: özet -->
  <rect x="55" y="566" width="390" height="32" rx="8" fill="#3d2020" stroke="#ff6b6b" stroke-width="1"/>
  <text x="68" y="586" fill="#ff9999" font-size="10"><tspan font-weight="bold" fill="#ff6b6b">Untracked hatırlatma:</tspan> Yeni dosya = Git listesinde yok. git add ile takibe alınır.</text>
</svg>
