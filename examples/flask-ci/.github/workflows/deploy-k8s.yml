# Kubernetes deploy — Secrets gerekir:
# DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, KUBE_CONFIG (kubeconfig dosyasının tam içeriği)
#
# İlk kurulum: kubectl apply -f k8s/ (Minikube veya kümede bir kez)
# CI her push'ta imajı günceller ve rollout status izler.
name: Deploy Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: flask-ci
  DEPLOYMENT: flask-ci

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8 .
      - run: pytest -v

  build-push:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-k8s:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
      - name: Manifestleri uygula
        run: kubectl apply -f k8s/
      - name: Yeni imajı devreye al
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT }} flask="$IMAGE"
          kubectl rollout status deployment/${{ env.DEPLOYMENT }} --timeout=120s
